# Umbriel config — migrated to 0.1.0 docs (https://docs.noctalia.dev/umbriel/)

[general]
mod_key = "Super"
autostart = ["noctalia"]
xwayland = true
show_cheatsheet = false
focus_on_activate = false
honor_restored_maximize = false

[environment]
MOZ_ENABLE_WAYLAND = "1"
MOZ_DBUS_REMOTE = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_QPA_PLATFORMTHEME = "qt6ct"
EGL_PLATFORM = "wayland"
_JAVA_AWT_WM_NONREPARENTING = "1"
GTK_IM_MODULE = "simple"
TERM = "kitty"
TERMINAL = "kitty"

[workspaces]
back_and_forth = false
empty_above = false

[colors]

[animation]
enabled = true
duration_ms = 200
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 150
curve = "easeout"
style = "popin"
scale = 0.85

[animation.windows_out]
enabled = true
duration_ms = 150
curve = "easeout"
style = "fade"

[animation.windows_move]
enabled = true
duration_ms = 250
curve = "snappy"

[animation.workspaces]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5
blur = false
scale = 0.0
maximize = false
fullscreen = false

[animation.border]
enabled = false
duration_ms = 250
curve = "easeout"

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.0

[animation.layers]
enabled = false
duration_ms = 250
curve = "easeout"

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 2
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02

[appearance.shadow]
enabled = false
softness = 10
offset_x = 2
offset_y = 2

[overview]
zoom = 0.5

[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"

[layout]
mode = "scrolling"
gap = 5
width_presets = [0.33333, 0.5, 0.66667, 1.0]

[layout.struts]
left = 0
right = 0
top = 0
bottom = 0

[layout.scrolling]
default_width_fraction = 0.66667
center_underfull_strip = false
center_focused = false
expand_single_column = true
# direction = "horizontal" # "horizontal" or "vertical" — keep horizontal (default)

[layout.dwindle]
# preserve_split = false

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true

# Workspace layout overrides (see docs/workspaces#workspace-rules)
# [[workspace]]
# name = "一"
# layout.mode = "scrolling"
# layout.gap = 5

[output."Samsung Electric Company S19C170 HYCFB02483"]
mode = "1366x768@60"
scale = 1
transform = "normal"
# Best for S19C170 1366x768@60Hz (no VRR/HDR per `umbriel outputs` Adaptive sync: disabled): keep composition bypass, no tearing/vrr
vrr = "disabled"
tearing = false
direct_scanout = true
hdr = "off"
sdr_white = 203
position = [0, 0]
enabled = true

[input]
middle_click_paste = true

[input.keyboard]
layout = "us"
variant = ""
options = ""
repeat_rate = 30
repeat_delay = 300
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"
sensitivity = 0.0
scroll_wheel_step = 60
# natural_scroll = false

[input.tablet]
enabled = true

[input.cursor]
theme = "Bibata-Modern-Classic"
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = true
hide_timeout_ms = 3000

[input.focus]
follows_mouse = false
follows_mouse_max_scroll = 0.0

# [[input.device]] per-device overrides (see docs/input#per-device-overrides)
# [[input.device]]
# name = "Acme Precision Touchpad"
# tap = true
# natural_scroll = false
# accel_profile = "flat"
# sensitivity = 0.0
# disable_while_typing = false

[keybinds]
"Mod+T" = "spawn:kitty"
"Ctrl+Alt+W" = "spawn:noctalia msg wallpaper-random"
"Ctrl+Alt+Delete" = "spawn:noctalia msg panel-toggle session"
"Mod+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+A" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Z" = "spawn:noctalia msg panel-toggle launcher /emo"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+X" = "spawn:noctalia msg bar-toggle"
"Mod+P" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Shift+T" = "spawn:noctalia msg panel-toggle test"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"
"F5" = "spawn:noctalia msg volume-down"
"F6" = "spawn:noctalia msg volume-up"
"Mod+Q" = "window-close"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Home" = "workspace-switch:1"
"Mod+End" = "workspace-switch:9"
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+WheelUp" = "workspace-previous"
"Mod+WheelDown" = "workspace-next"
"Mod+Ctrl+WheelUp" = "window-move-to-workspace-previous"
"Mod+Ctrl+WheelDown" = "window-move-to-workspace-next"
"Mod+Shift+WheelUp" = "column-move-left"
"Mod+Shift+WheelDown" = "column-move-right"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Ctrl+Page_Down" = "window-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "window-move-to-workspace-previous"
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+BracketLeft" = "window-consume-left"
"Mod+BracketRight" = "window-consume-right"
"Mod+R" = "window-cycle-width"
"Mod+Ctrl+R" = "window-toggle-maximize-to-edges"
"Mod+F" = "window-toggle-maximize"
"Mod+E" = "spawn:nautilus"
"Mod+N" = "workspace-set-layout:toggle"
"Mod+O" = "overview-toggle"
"Mod+Minus" = "window-modify-width:-0.1"
"Mod+Equal" = "window-modify-width:0.1"
"Mod+C" = "window-toggle-floating"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Print" = "spawn:noctalia msg screenshot-fullscreen"
"Alt+F" = "window-toggle-fullscreen"
"Alt+Tab" = "spawn:noctalia msg window-switcher"
"Mod+MouseMiddle" = "layout-scroll-drag"

# ─── Window Rules ─
# Gaming/Wayland optimizations for Vega 5600G + 60Hz SDR (no VRR/HDR) — enable only what you need
# Uncomment for lowest latency on fullscreen games (requires output tearing=true):
# [[window_rule]]
# match.content_type = "game"
# vrr = "disabled" # S19C170 has no VRR; "always" only if you connect VRR monitor
# tearing = true   # force async flip even without client hint; output must have tearing=true
# hdr = "off"
# For Proton/Wine fullscreen: match.xdg_tag = "^proton-game$" + default_fullscreen = true

[[window_rule]]
blur = true

[[window_rule]]
match.app_id = '^(org[.]gnome[.]Nautilus)$'
opacity = 0.80

[[window_rule]]
match.app_id = '^(ai[.]opencode[.]desktop)$'
opacity = 0.82

[[window_rule]]
match.app_id = "kitty"
opacity = 0.85

[[window_rule]]
match.app_id = "brave-browser"
opacity = 0.95

[[window_rule]]
match.app_id = "protonplus"
opacity = 0.82
blur = true

[[window_rule]]
match.app_id = "^(org[.]gnome[.]TextEditor|gnome-text-editor)$"
opacity = 0.80

[[window_rule]]
match.app_id = "vesktop"
opacity = 0.80

[[window_rule]]
match.app_id = "helium"
opacity = 0.90

[[window_rule]]
match.app_id = "blender"
default_floating = false

[[window_rule]]
match.app_id = "brave-browser"
default_floating = false

[[window_rule]]
match.app_id = "org.gnome.Loupe"
default_floating = true

[[window_rule]]
match.app_id = "kvantummanager|qt5ct|qt6ct|nwg-look|org.kde.ark|org.pulseaudio.pavucontrol|blueman-manager"
default_floating = true

[[window_rule]]
match.title = "^Open$|^Save As$|^Choose Files$|^File Operation Progress$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = false
default_size = [800, 600]

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
