# Rules

# Gaming
# [[window_rule]]
# match.content_type = "game"
# vrr = "disabled"
# tearing = true
# hdr = "off"
# For Proton/Wine fullscreen: match.xdg_tag = "^proton-game$" + default_fullscreen = true

# Global blur
[[window_rule]]
blur = true
blur_optimized = false
blur_popups = true
blur_ignore_alpha = 0.05

[[window_rule]]
opacity = 0.90

[[window_rule]]
match.app_id     = "steam_app.*|ffxiv.*"
default_floating = true
opacity          = 1.0
blur             = false
blur_popups      = false

[[window_rule]]
match.xdg_tag    = "proton-game"
default_floating = true
opacity          = 1.0
blur             = false
blur_popups      = false

[[window_rule]]
match.content_type = "game"
default_floating   = true
opacity            = 1.0
blur               = false
blur_popups        = false

[[window_rule]]
match.content_type = "video"
blur = false
opacity = 1.0

[[window_rule]]
match.content_type = "photo"
blur = false
opacity = 1.0

# App opacity
[[window_rule]]
match.app_id = "^(Alacritty|kitty|ghostty|foot)$"
opacity = 0.9

[[window_rule]]
match.app_id = "[Vv]esktop|[Dd]iscord|brave-browser|chromium|helium"
opacity = 0.93

[[window_rule]]
match.app_id = "^org.mozilla.firefox$"
blur = false
opacity = 1.0

[[window_rule]]
match.app_id = "^zen"
blur = false
opacity = 1.0

# Nautilus stable
[[window_rule]]
match.app_id = "org.gnome.Nautilus|org.gnome.Settings|org.gnome.Loupe"
blur = true
blur_optimized = true
blur_popups = false
blur_ignore_alpha = 0.2
opacity = 0.90

[[window_rule]]
match.app_id = "blender"
default_floating = false

[[window_rule]]
match.app_id = "org.gnome.Loupe"
default_floating = true

[[window_rule]]
match.app_id = "kvantummanager|qt5ct|qt6ct|nwg-look|org.kde.ark|org.pulseaudio.pavucontrol|blueman-manager"
default_floating = true

[[window_rule]]
match.title = "^Open$|^Save As$|^Choose Files$|^File Operation Progress$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = false
default_size = [800, 600]

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = false
default_size = [1020, 900]
blur = true
blur_popups = false
opacity = 1.0

# Layer rules
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
blur_popups = true

