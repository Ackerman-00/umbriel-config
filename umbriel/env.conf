# env.conf — environment only (applied at startup, needs restart + relaunch of long-running apps)
# Docs: https://docs.noctalia.dev/umbriel/configuration/#environment
# NOTE: Umbriel reserves WAYLAND_DISPLAY, WAYLAND_SOCKET, DISPLAY, UMBRIEL_SOCKET,
# XDG_CURRENT_DESKTOP, XDG_SESSION_DESKTOP, XDG_SESSION_TYPE — do not set them here.

[environment]
MOZ_ENABLE_WAYLAND = "1"
MOZ_DBUS_REMOTE = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_QPA_PLATFORMTHEME = "qt6ct"
EGL_PLATFORM = "wayland"
_JAVA_AWT_WM_NONREPARENTING = "1"
GTK_IM_MODULE = "simple"
TERM = "kitty"
TERMINAL = "kitty"

# Hardware events (laptop lid). Uncomment to enable.
# Docs: https://docs.noctalia.dev/umbriel/configuration/#events
# [events]
# lid_close = "notify-send 'The laptop lid is closed!'"
# lid_open = "notify-send 'The laptop lid is open!'"
